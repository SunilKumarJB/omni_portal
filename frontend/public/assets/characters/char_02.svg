<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A148C"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="24"/></clipPath>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <!-- Head -->
    <circle cx="100" cy="70" r="30" fill="#FFCCBC"/>
    <!-- Hair (longer, professional female) -->
    <path d="M68 65 Q68 36 100 34 Q132 36 132 65 Q135 50 130 65 Q126 80 120 86 L80 86 Q74 80 70 65 Q65 50 68 65Z" fill="#3E2723"/>
    <!-- Ear details -->
    <ellipse cx="70" cy="72" rx="5" ry="7" fill="#FFCCBC"/>
    <ellipse cx="130" cy="72" rx="5" ry="7" fill="#FFCCBC"/>
    <!-- Neck -->
    <rect x="90" y="98" width="20" height="14" rx="4" fill="#FFCCBC"/>
    <!-- Blazer -->
    <path d="M40 200 L40 145 Q68 130 88 128 L100 148 L112 128 Q132 130 160 145 L160 200Z" fill="#6A1B9A"/>
    <!-- Blouse -->
    <path d="M88 128 L100 148 L112 128 L110 200 L90 200Z" fill="#F3E5F5"/>
    <!-- Scarf/necklace accent -->
    <ellipse cx="100" cy="128" rx="14" ry="6" fill="none" stroke="#CE93D8" stroke-width="2"/>
    <!-- Jacket lapels -->
    <path d="M88 128 L76 148 L92 136Z" fill="#7B1FA2"/>
    <path d="M112 128 L124 148 L108 136Z" fill="#7B1FA2"/>
  </g>
  <rect x="0" y="182" width="200" height="18" fill="rgba(0,0,0,0.35)"/>
  <text x="100" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.75)" letter-spacing="1">BUSINESS PRO · F</text>
</svg>
