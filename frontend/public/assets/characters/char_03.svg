<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF360C"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="24"/></clipPath>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <!-- Head -->
    <circle cx="100" cy="72" r="30" fill="#FFCCBC"/>
    <!-- Short wavy hair -->
    <path d="M70 60 Q72 38 100 36 Q128 38 130 60 Q128 44 100 42 Q72 44 70 60Z" fill="#212121"/>
    <path d="M70 60 Q68 68 70 74 Q72 60 80 56Z" fill="#212121"/>
    <path d="M130 60 Q132 68 130 74 Q128 60 120 56Z" fill="#212121"/>
    <!-- Beard stubble hint -->
    <path d="M82 92 Q100 98 118 92 Q116 96 100 98 Q84 96 82 92Z" fill="rgba(33,33,33,0.25)"/>
    <!-- Neck -->
    <rect x="90" y="98" width="20" height="14" rx="4" fill="#FFCCBC"/>
    <!-- Casual hoodie -->
    <path d="M38 200 L38 148 Q66 132 90 130 L100 150 L110 130 Q134 132 162 148 L162 200Z" fill="#212121"/>
    <!-- Hoodie kangaroo pocket -->
    <rect x="80" y="168" width="40" height="20" rx="6" fill="#1A1A1A"/>
    <!-- Hoodie strings -->
    <line x1="96" y1="132" x2="94" y2="155" stroke="#424242" stroke-width="2" stroke-linecap="round"/>
    <line x1="104" y1="132" x2="106" y2="155" stroke="#424242" stroke-width="2" stroke-linecap="round"/>
    <!-- Inner shirt collar visible -->
    <path d="M90 130 L100 145 L110 130" fill="none" stroke="#FF7043" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="0" y="182" width="200" height="18" fill="rgba(0,0,0,0.35)"/>
  <text x="100" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.75)" letter-spacing="1">CREATIVE · M</text>
</svg>
