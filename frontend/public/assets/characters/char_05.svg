<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="24"/></clipPath>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <!-- Grid pattern background (tech aesthetic) -->
  <g opacity="0.06">
    <line x1="0" y1="25" x2="200" y2="25" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="200" y2="50" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="75" x2="200" y2="75" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="125" x2="200" y2="125" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="200" y2="150" stroke="white" stroke-width="0.5"/>
    <line x1="25" y1="0" x2="25" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="50" y1="0" x2="50" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="75" y1="0" x2="75" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="125" y1="0" x2="125" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="175" y1="0" x2="175" y2="200" stroke="white" stroke-width="0.5"/>
  </g>
  <g clip-path="url(#clip)">
    <!-- Head -->
    <circle cx="100" cy="72" r="29" fill="#FFCCBC"/>
    <!-- Short hair (neutral tech look) -->
    <path d="M71 65 Q73 40 100 38 Q127 40 129 65 Q127 46 100 44 Q73 46 71 65Z" fill="#37474F"/>
    <path d="M71 65 Q70 72 72 76 Q71 62 78 58Z" fill="#37474F"/>
    <path d="M129 65 Q130 72 128 76 Q129 62 122 58Z" fill="#37474F"/>
    <!-- Glasses (tech look) -->
    <rect x="76" y="68" width="20" height="14" rx="5" fill="none" stroke="#37474F" stroke-width="2.5"/>
    <rect x="104" y="68" width="20" height="14" rx="5" fill="none" stroke="#37474F" stroke-width="2.5"/>
    <line x1="96" y1="75" x2="104" y2="75" stroke="#37474F" stroke-width="2.5"/>
    <line x1="71" y1="75" x2="76" y2="75" stroke="#37474F" stroke-width="2"/>
    <line x1="124" y1="75" x2="129" y2="75" stroke="#37474F" stroke-width="2"/>
    <!-- Lens tint -->
    <rect x="76" y="68" width="20" height="14" rx="5" fill="rgba(100,181,246,0.12)"/>
    <rect x="104" y="68" width="20" height="14" rx="5" fill="rgba(100,181,246,0.12)"/>
    <!-- Neck -->
    <rect x="90" y="99" width="20" height="14" rx="4" fill="#FFCCBC"/>
    <!-- Tech hoodie / zip-up -->
    <path d="M38 200 L38 148 Q65 132 90 130 L100 150 L110 130 Q135 132 162 148 L162 200Z" fill="#263238"/>
    <!-- Zip line -->
    <line x1="100" y1="132" x2="100" y2="200" stroke="#37474F" stroke-width="2.5"/>
    <!-- Green accent collar -->
    <path d="M90 130 L100 145 L110 130" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Laptop bag strap hint -->
    <path d="M148 145 L155 170 L148 200" fill="none" stroke="#455A64" stroke-width="4" stroke-linecap="round"/>
    <!-- Terminal icon on chest -->
    <rect x="80" y="158" width="28" height="18" rx="4" fill="#1B5E20" opacity="0.6"/>
    <text x="94" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#69F0AE">$_</text>
  </g>
  <rect x="0" y="182" width="200" height="18" fill="rgba(0,0,0,0.35)"/>
  <text x="100" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.75)" letter-spacing="1">TECH ENTHUSIAST</text>
</svg>
