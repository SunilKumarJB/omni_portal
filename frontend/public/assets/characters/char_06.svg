<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FF6D00"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFAB40" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <clipPath id="clip"><rect width="200" height="200" rx="24"/></clipPath>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <!-- Ambient glow at top -->
  <ellipse cx="100" cy="20" rx="80" ry="50" fill="url(#glow)"/>
  <!-- Sparkle stars background -->
  <g fill="rgba(255,255,255,0.30)" font-size="10">
    <text x="22" y="30">✦</text>
    <text x="168" y="45">✦</text>
    <text x="15" y="130">✦</text>
    <text x="172" y="120">✦</text>
    <text x="35" y="175">✦</text>
    <text x="160" y="170">✦</text>
  </g>
  <g clip-path="url(#clip)">
    <!-- Head -->
    <circle cx="100" cy="68" r="30" fill="#FFCCBC"/>
    <!-- Stylish hair (influencer look) -->
    <path d="M68 55 Q70 30 100 28 Q130 30 132 55 Q130 35 100 33 Q70 35 68 55Z" fill="#1A1A1A"/>
    <!-- Highlighted strand -->
    <path d="M90 32 Q88 40 86 58" fill="none" stroke="#FF8A65" stroke-width="3" stroke-linecap="round"/>
    <!-- Side swept hair -->
    <path d="M68 55 Q63 68 66 82 Q66 64 74 60Z" fill="#1A1A1A"/>
    <!-- Ear details -->
    <ellipse cx="70" cy="70" rx="5" ry="7" fill="#FFCCBC"/>
    <!-- Hoop earring -->
    <circle cx="70" cy="79" r="5" fill="none" stroke="#FFAB40" stroke-width="2"/>
    <!-- Neck -->
    <rect x="90" y="95" width="20" height="15" rx="4" fill="#FFCCBC"/>
    <!-- Lifestyle top (stylish) -->
    <path d="M35 200 L35 155 Q60 136 88 133 L100 152 L112 133 Q140 136 165 155 L165 200Z" fill="#BF360C"/>
    <!-- Shoulder accent lines (fashion detail) -->
    <line x1="48" y1="152" x2="82" y2="140" stroke="#FFAB40" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="152" y1="152" x2="118" y2="140" stroke="#FFAB40" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Necklace -->
    <path d="M86 134 Q100 142 114 134" fill="none" stroke="#FFAB40" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="100" cy="143" r="3" fill="#FFAB40"/>
    <!-- Phone in hand hint (influencer) -->
    <rect x="148" y="158" width="14" height="24" rx="3" fill="#1A1A1A" opacity="0.6"/>
    <rect x="149" y="160" width="12" height="18" rx="2" fill="rgba(255,255,255,0.08)"/>
    <!-- Star badge -->
    <text x="34" y="175" font-size="16">⭐</text>
  </g>
  <rect x="0" y="182" width="200" height="18" fill="rgba(0,0,0,0.35)"/>
  <text x="100" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.75)" letter-spacing="1">LIFESTYLE INFLUENCER</text>
</svg>
